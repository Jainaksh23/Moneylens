name: MoneyLens CI & Delivery Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend API Gateway Validation
  # ============================================================================
  backend-test:
    name: Backend (Lint & Jest Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run Jest Test Suite (123 Tests)
        run: npm test
      - name: Verify TypeScript Build
        run: npm run build

  # ============================================================================
  # 2. Machine Learning & RAG Subsystem Validation
  # ============================================================================
  ml-service-test:
    name: ML Service (Ruff & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv Package Manager
        run: pip install uv
      - name: Install Dependencies
        run: uv pip install --system -r requirements.txt
      - name: Run Ruff Linter
        run: ruff check .
      - name: Run Pytest Suite (82 Tests)
        run: pytest -v

  # ============================================================================
  # 3. Frontend React / Vite Application Validation
  # ============================================================================
  frontend-test:
    name: Frontend (Vitest & Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Run Vitest Suite (14 Tests)
        run: npm test
      - name: Run Production Bundle Build (Vite)
        run: npm run build

  # ============================================================================
  # 4. Multi-Stage Dockerfile Compilation Check
  # ============================================================================
  docker-build-check:
    name: Dockerfile Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, ml-service-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: moneylens-backend:ci-check

      - name: Build ML Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          file: ./ml-service/Dockerfile
          push: false
          tags: moneylens-ml-service:ci-check

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: moneylens-frontend:ci-check

  # ============================================================================
  # 5. Post-Deploy Live Smoke Test (runs only on main push, after Docker check)
  # ============================================================================
  post-deploy-smoke:
    name: Post-Deploy Live Verification
    runs-on: ubuntu-latest
    needs: [docker-build-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for Render Deploy (Cold Start Grace Period)
        run: sleep 60
      - name: Run Post-Deploy Smoke Test
        run: node scripts/post_deploy_smoke.js ${{ vars.FRONTEND_URL || 'https://moneylens.vercel.app' }}
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        continue-on-error: true  # Don't fail CI if live services are cold/sleeping
